name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol-and-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m pip install -r requirements-red.txt
      - run: python -m unittest discover -s custom-firmware/red/tools -p test_red_rc7.py -v
